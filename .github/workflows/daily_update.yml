name: Daily Stock Update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-stock-update
  cancel-in-progress: false

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily price update
        run: |
          python src/daily_update.py

      - name: Retrain models
        run: |
          python src/model_train.py

      - name: Generate predictions
        run: |
          python src/predict.py

      - name: Evaluate predictions
        run: |
          python src/evaluate_predictions.py

      - name: Debug output files
        run: |
          echo "CSV and model files:"
          find . -maxdepth 4 -type f \( -name "*.csv" -o -name "*.json" -o -name "*.pkl" \) | sort
          echo "Outputs folder:"
          ls -lah outputs || true
          echo "Data folder:"
          ls -lah data || true

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add outputs/*.csv || true
          git add data/predictions_history.csv || true
          git add data/prediction_evaluation.csv || true
          git add data/*.json || true
          git add *.pkl || true

          git status

          git commit -m "Auto daily stock update" || echo "No changes to commit"

          git pull --rebase origin main
          git push origin main