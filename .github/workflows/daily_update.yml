name: Daily Stock Update

on:
  workflow_dispatch:

  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-stock-update
  cancel-in-progress: false

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # Step 1 - Update stock prices
      # ==========================================
      - name: Daily Update
        run: |
          python src/daily_update.py

      # ==========================================
      # Step 2 - Train model
      # ==========================================
      - name: Train Model
        run: |
          python src/model_train.py

      # ==========================================
      # Step 3 - Evaluate old predictions
      # ==========================================
      - name: Evaluate Predictions
        run: |
          python src/evaluate_predictions.py

      # ==========================================
      # Step 4 - Generate new predictions
      # ==========================================
      - name: Generate Predictions
        run: |
          python src/predict.py

      # ==========================================
      # Commit updated outputs/data
      # ==========================================
      - name: Commit updated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add outputs/*.csv || true
          git add data/*.csv || true
          git add data/*.json || true

          git commit -m "Auto daily stock update" || echo "No changes to commit"

          git push