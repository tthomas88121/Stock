name: Daily Stock Update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-stock-update
  cancel-in-progress: false

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # Daily Update
      # ==========================================
      - name: Run daily price update
        run: |
          python src/daily_update.py

      # ==========================================
      # Verify dataset
      # ==========================================
      - name: Verify merged dataset exists
        run: |
          echo "Checking dataset folders..."

          echo "===== data ====="
          ls -lah data || true

          echo "===== data/processed ====="
          ls -lah data/processed || true

          echo "===== search merged dataset ====="
          find data -name "merged_dataset.csv" || true

          if [ ! -f data/processed/merged_dataset.csv ]; then
            echo "ERROR: merged_dataset.csv not found!"
            exit 1
          fi

          echo "merged_dataset.csv found successfully."

      # ==========================================
      # Train Model
      # ==========================================
      - name: Retrain models
        run: |
          python src/model_train.py

      # ==========================================
      # Predict
      # ==========================================
      - name: Generate predictions
        run: |
          python src/predict.py

      # ==========================================
      # Evaluate
      # ==========================================
      - name: Evaluate predictions
        run: |
          python src/evaluate_predictions.py

      # ==========================================
      # Debug output
      # ==========================================
      - name: Debug output files
        run: |
          echo "CSV / JSON / PKL files:"
          find . -maxdepth 5 -type f \( -name "*.csv" -o -name "*.json" -o -name "*.pkl" -o -name "*.joblib" \) | sort

      # ==========================================
      # Commit results
      # ==========================================
      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/processed/*.csv || true
          git add data/*.csv || true
          git add data/*.json || true
          git add outputs/*.csv || true
          git add *.pkl || true
          git add models/*.pkl || true

          git status

          git commit -m "Auto daily stock update" || echo "No changes to commit"

          git pull --rebase origin main
          git push origin main