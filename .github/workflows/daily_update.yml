name: Daily Stock Update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-stock-update
  cancel-in-progress: false

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily update
        run: |
          python src/daily_update.py

      - name: Retrain models
        run: |
          python src/model_train.py

      - name: Generate predictions
        run: |
          python src/predict.py

      - name: Evaluate predictions
        run: |
          python src/evaluate_predictions.py

      - name: Debug output files
        run: |
          echo "Current files:"
          find . -maxdepth 3 -type f | sort
          echo "Output CSV files:"
          ls -lah outputs || true

      - name: Commit updated files
        run: |
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"

              git add outputs/*.csv || true
              git add data/model_metrics.json || true
              git add *.pkl || true

              git status

              git commit -m "Auto daily stock update" || echo "No changes"

              git pull --rebase origin main
              git push origin main