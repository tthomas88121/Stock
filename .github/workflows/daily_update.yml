name: Daily Stock Update

on:
  workflow_dispatch:

  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-stock-update
  cancel-in-progress: false

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Daily Update
        run: |
          python src/daily_update.py

      - name: Train Model
        run: |
          python src/model_train.py

      - name: Evaluate Predictions
        run: |
          python src/evaluate_predictions.py

      - name: Generate Predictions
        run: |
          python src/predict.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add outputs/*.csv || true
          git add data/predictions_history.csv || true
          git add data/prediction_evaluation.csv || true
          git add data/model_metrics.json || true
          git add data/training_features.json || true

          git status

          git commit -m "Auto daily stock update" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin main